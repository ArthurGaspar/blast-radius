name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *" # daily: refresh the vulnerability snapshot the Pages build starts from
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      # Docker is available on the runner, so the PostgreSQL contract test runs here (it is skipped without Docker).
      - name: Test (SQLite and PostgreSQL via Testcontainers)
        working-directory: api
        run: dotnet test

  web:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      # Live ingestion with the job's token (5000 GitHub requests/hour). If a source fails, the committed snapshot stays.
      - name: Refresh the snapshot from NVD, GitHub, KEV and EPSS
        if: github.event_name != 'pull_request'
        working-directory: api
        env:
          Sources__GithubToken: ${{ secrets.GITHUB_TOKEN }}
          Sources__NvdApiKey: ${{ secrets.NVD_API_KEY }}
        run: |
          dotnet run --project src/BlastRadius.Api -c Release -- snapshot "$RUNNER_TEMP/snapshot.json" \
            --Ingestion:Scheduled=false "--ConnectionStrings:Default=Data Source=$RUNNER_TEMP/snap.db" \
            && cp "$RUNNER_TEMP/snapshot.json" ../web/public/data/snapshot.json \
            || echo "::warning::Snapshot refresh failed; deploying the committed snapshot"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test and build the browser build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compose images
        run: docker compose build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
