# PostgreSQL, the API (which ingests on startup and every 6 hours) and the web client pointed at it.
#   docker compose up --build
# Web: http://localhost:5173   API: http://localhost:8080 (OpenAPI document at /openapi/v1.json)
# Optional: NVD_API_KEY (faster NVD paging) and GITHUB_TOKEN (5000 GitHub requests/hour instead of 60).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blast_radius
      POSTGRES_USER: blast
      POSTGRES_PASSWORD: blast
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blast -d blast_radius"]
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      Database__Provider: postgres
      ConnectionStrings__Default: Host=db;Database=blast_radius;Username=blast;Password=blast
      Jwt__Secret: ${JWT_SECRET:-compose-secret-change-me-0123456789abcdef}
      Cors__Origins__0: http://localhost:5173
      Sources__NvdApiKey: ${NVD_API_KEY:-}
      Sources__GithubToken: ${GITHUB_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
